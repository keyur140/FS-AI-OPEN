# fsai-open: track and cone geometry used by the seeded track generator, one source per value
# Author: KEYUR SHAILESHKUMAR PATEL (ORCID https://orcid.org/0009-0008-5261-043X)
# Affiliations: (1) MSc Artificial Intelligence student, Department of Computer Science,
#   Brunel University London, UK; (2) Independent researcher
# Conducted independently; not an official Brunel University London project.
# Drafted with an AI assistant (Claude, Anthropic); design decisions by the author.
#
# Plain words: the shape of the pretend tracks, taken from the FS-AI 2026 rules wherever the rules
# give a number. Everything that is our own choice says so.
#
# Sources:
#   FSAI26 = IMechE "2026 FS-AI Rules" v1 (chapter D dynamic events, IN2 inspection, T1/T4 technical).
#            The rules for this competition; used first wherever they give a value.
#   HB21 = IMechE "FS-AI Dynamic Events Setup and Cones Specification" (2021), section DE6.3 and
#          Figures 1-3 (cone sizes, spacing and layout drawings; FSAI26 D2.5.1 points to it).
#   DS26 = Formula Student Driverless Specification 2026 v1.1 (2026-05-16), section DS 1 (same cone rules)
#
# Staging distances are measured by the rules from the front of the car (or its front wheels); the
# generator converts them to the car's rear axle with the dimensions in ads_dv.yaml.
cones:
  max_spacing_m:        {value: 5.0,   source: "HB21 DE6.3.1 and DS26 DS 1.1: max 5 m between cones in driving direction"}
  corner_spacing_m:     {value: 2.5,   source: "fsai-open choice; HB21 DE6.3.1 only says it may be smaller in corners"}
  corner_radius_m:      {value: 15.0,  source: "fsai-open choice: below this centreline radius, corner spacing applies"}
  small_base_m:         {value: 0.228, source: "HB21 Table 2: small orange, yellow and blue cones 228 x 228 x 325 mm, 0.45 kg"}
  small_height_m:       {value: 0.325, source: "HB21 Table 2"}
  big_base_m:           {value: 0.285, source: "HB21 Table 2: big orange cone 285 x 285 x 505 mm, 1.05 kg"}
  big_height_m:         {value: 0.505, source: "HB21 Table 2"}
  placement_noise_m:    {value: 0.05,  source: "fsai-open choice: hand-placed cones are not exact"}
track:
  width_m:              {value: 3.0,   source: "FSAI26 D6.1.1 / D8.1.1 and HB21 Fig. 1-2: minimum track width 3 m"}
acceleration:
  length_m:             {value: 75.0,  source: "FSAI26 D5.1.1: 75 m from starting line to finish line"}
  staging_m:            {value: 0.30,  source: "FSAI26 D5.3.3: foremost part of the vehicle 0.30 m before the starting line"}
  stop_area_m:          {value: 100.0, source: "FSAI26 D5.3.6: full stop within 100 m after the finish line, inside the exit lane; HB21 Fig. 1 cones"}
skidpad:
  inner_diameter_m:     {value: 15.25, source: "FSAI26 D4.1.2"}
  outer_diameter_m:     {value: 21.25, source: "FSAI26 D4.1.2 (3 m driving path between the circles, D4.1.5)"}
  centre_distance_m:    {value: 18.25, source: "FSAI26 D4.1.2: the centres of the circles are 18.25 m apart"}
  inner_cones:          {value: 16,    source: "FSAI26 D4.1.3: 16 cones around the inside of each inner circle"}
  outer_cones:          {value: 13,    source: "FSAI26 D4.1.3: 13 cones around the outside of each outer circle, pattern of HB21 Fig. 3"}
  laps_per_side:        {value: 2,     source: "FSAI26 D4.3.5: right circle twice (2nd timed), then left circle twice (4th timed)"}
  entry_m:              {value: 15.0,  source: "FSAI26 D4.3.3: foremost part of the vehicle staged 15 m before the timekeeping line"}
  exit_m:               {value: 25.0,  source: "FSAI26 D4.3.6: full stop within 25 m after the timekeeping line, inside the exit lane"}
trackdrive:
  laps:                 {value: 10,    source: "FSAI26 D8.2.4: at least one run of ten laps"}
  stop_after_finish_m:  {value: 30.0,  source: "FSAI26 D6.3.7 and D8.2.7: full stop within 30 m after the finish line, then AS Finished"}
  max_straight_m:       {value: 80.0,  source: "FSAI26 D6.1.1 / D8.1.1: straights no longer than 80 m"}
  min_hairpin_outside_diameter_m: {value: 9.0, source: "FSAI26 D6.1.1 / D8.1.1: hairpins at least 9 m outside diameter (centreline radius 3 m); generated tracks use min_radius_m, which is larger"}
  length_min_m:         {value: 200.0, source: "fsai-open choice for generated tracks"}
  length_max_m:         {value: 500.0, source: "fsai-open choice for generated tracks"}
  min_radius_m:         {value: 5.0,   source: "fsai-open choice: ADS-DV turns at about 3.4 m radius with 24 deg steer (1.53 m / tan 24 deg), so the tightest legal hairpin (3 m centreline radius) is out of its reach; 5 m keeps a margin"}
  start_offset_m:       {value: 6.0,   source: "FSAI26 D6.3.5 / D8.2.5: front wheels staged 6 m before the starting line"}
